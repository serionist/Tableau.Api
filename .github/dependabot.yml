# Dependabot version updates, weekly on Monday: the NuGet packages of the solution's projects and of the offline tests,
# the actions the workflows pin by SHA, and the .NET SDK in global.json. Minor and patch updates come grouped, one PR a
# week for each ecosystem; a major comes on a PR of its own. Each is a PR like any other, and CI must pass: a minor or patch update
# then merges itself (dependabot-auto-merge.yml), and a major waits for a maintainer. Security updates come as soon as
# an advisory is published, whatever the schedule (they are on in the repository's settings); the cooldown holds
# version updates only.
#
# eng/'s file-based apps use no packages, and Dependabot can't read a file-based app's `#:package` lines yet
# (dependabot/dependabot-core#15187), so eng/ has no entry: an entry there would only fail to find a project. Add one
# when an app there takes a package and Dependabot can read it.
version: 2

updates:
  - package-ecosystem: nuget
    # The solution's projects, and the offline tests, which are not in the solution: it still holds the old live suite,
    # which would clash with their project's name.
    directories: ["/", "/tests/Tableau.Api.Tests"]
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a version is published before proposing it, so a broken or compromised release is pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Dependabot moves the pinned SHA and the version comment beside it together.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    ignore:
      # The SDK's major moves with the target framework, so a maintainer moves it by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
