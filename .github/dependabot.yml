# Dependabot version updates, weekly on Monday: the NuGet packages (one version each, in Directory.Packages.props, for
# the projects of Tableau.Api.slnx), the local tools in .config/dotnet-tools.json, the actions the workflows pin by SHA, and the
# .NET SDK in global.json. Minor and patch updates come grouped, one PR a week for each ecosystem; a major comes on a
# PR of its own. Each is a PR like any other, and CI must pass: an update then merges itself
# (dependabot-auto-merge.yml), but a major update of a package the library ships with waits for a maintainer. Security
# updates come as soon as an advisory is published, whatever the schedule (they are on in the repository's settings);
# the cooldown holds version updates only.
#
# eng/'s file-based apps use no packages, and Dependabot can't read a file-based app's `#:package` lines yet
# (dependabot/dependabot-core#15187), so eng/ has no entry: an entry there would only fail to find a project. Add one
# when an app there takes a package and Dependabot can read it. eng/apicompat/Baseline.csproj pins the package 1.2.5
# depended on, which never moves, and is in no solution, so Dependabot leaves it alone.
#
# CI restores in locked mode. Dependabot rewrites the lock files of the projects that reference a bumped package, but
# can miss one that only gets it through a project reference, as the tests get the library's packages
# (dependabot/dependabot-core#13950). Its PR then fails restore with NU1004: a maintainer runs
# `dotnet restore Tableau.Api.slnx --force-evaluate` on its branch and pushes the lock files it changes.
version: 2

updates:
  - package-ecosystem: nuget
    # Tableau.Api.slnx's projects and Directory.Packages.props, found from the root, and .config/dotnet-tools.json, the one
    # place Dependabot reads a tool manifest.
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a version is published before proposing it, so a broken or compromised release is pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Dependabot moves the pinned SHA and the version comment beside it together.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    ignore:
      # The SDK's major moves with the target framework, so a maintainer moves it by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
