# CI on every pull request, every push to main, once a day on main, and by hand.
#
# - Checks (Linux): the gate's quick lane: its selftest, the library's build, AGENTS.md, the skills and their links, the
#   hooks, no tool attribution in the commits, and gitleaks over them; and the code style, which dotnet format verifies
#   on the whole solution, so a change can't undo the reformat.
# - Build, test and pack (Linux): the solution, Tableau.Api.slnx, restored in locked mode and built in Release; the
#   offline tests with coverage, held to their floors by eng/coverage-gate.cs; the package, packed with package
#   validation against 1.2.5 and checked with eng/package-check.cs; and the API compared with 1.2.5's by
#   eng/apicompat.cs, against the ledger of breaks in eng/apicompat/1.2.5.xml.
# - Tests (Linux, <culture>): the offline tests and the coverage gate again, in a culture and a time zone whose rules
#   differ from the invariant culture's and from UTC: Swedish writes -1 with U+2212, Turkish capitalises i as İ, and
#   both zones are off UTC by a part of an hour, one ahead of it and one behind. A canary test fails the leg when its
#   culture or zone did not take.
# - Selftest and tests (Windows): the gate's selftest, the offline tests and the coverage gate, where paths, line
#   endings and the TLS stack differ from Linux.
# - Native AOT (Linux): tests/Tableau.Api.Aot published with native AOT, which fails on any trim or AOT warning in the
#   2.0 types its roots.xml keeps, then run: it reads and writes the fixtures through the generated models.
# - CI sums those up; it and pr-text.yml's PR text are the checks the main ruleset requires.
#
# Every job that builds the library checks out the whole history: MinVer versions it from git's tags and history, and
# a shallow clone would give it neither. The coverage gate also reads origin/main's floors from it, since a floor only
# rises.
#
# Nothing here runs on a Tableau site: the tests in the Live and ServerOnly categories are inconclusive without their
# switches (tests/Tableau.Api.Tests/TableauSite.cs), so a PR says what ran against a site (AGENTS.md, Build and test).
#
# The daily run is for Dependabot's merges: dependabot-auto-merge.yml turns on auto-merge with the workflow's token,
# and a push made with that token starts no run, so main is checked within a day of one instead.
#
# release/1.x's weekly package audit is audit-1x.yml, a workflow of its own, so a failure there leaves main's CI and
# its badge alone.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per ref. A newer push to a PR cancels its older run. Each run on main, a push, a scheduled one or one by
  # hand, keeps its own result: its group also names the commit, so the next push never cancels a waiting run.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The attribution and secret checks read the commits since the base, which a shallow clone doesn't have, and
          # MinVer reads the history when the gate builds the library.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The version .gitleaks.toml names, checked against the SHA-256 its release publishes.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C /usr/local/bin gitleaks
      # The commits checked start after the PR's base, or after the commit main was on before the push. A PR's checkout
      # is the merge of its branch into the base, so that merge is checked too. A push's before is all zeros for a new
      # branch, and a commit no longer in the history after a force push; a scheduled run and a run by hand have none.
      # Then the head commit alone is checked, since a squash merge is one commit. GATE_REQUIRE_GITLEAKS makes a
      # missing gitleaks a failure, not a warning.
      - name: The gate's quick lane
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_REQUIRE_GITLEAKS: "1"
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::${BASE:-no base} is not in the history; checking HEAD~1..HEAD"
            BASE=HEAD~1
          fi
          dotnet run eng/gate.cs -- quick --base "$BASE"
      # Whitespace, the code style and the analyzers' fixes, as .editorconfig sets them: a change that a dotnet format
      # run would rewrite fails here, so the reformatted code stays formatted.
      - name: Code style
        run: dotnet format Tableau.Api.slnx --verify-no-changes

  # What a release would publish, tested, packed and checked on every run. ContinuousIntegrationBuild is on where
  # GITHUB_ACTIONS is set, so the build and the package hold no path of the runner, and every restore is locked where CI
  # is set (Directory.Build.props).
  package:
    name: Build, test and pack (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # In a shallow clone MinVer finds no history and versions every build 2.0.0-alpha.0, without a warning.
      - name: The whole history, for MinVer
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - name: Restore (locked)
        run: dotnet restore Tableau.Api.slnx --locked-mode
      - name: Build
        run: dotnet build Tableau.Api.slnx --no-restore -c Release
      # global.json runs the tests on Microsoft.Testing.Platform; tests/coverage.config says what is measured.
      - name: Test with coverage
        run: >-
          dotnet test --solution Tableau.Api.slnx --no-build -c Release
          --coverage --coverage-output-format cobertura --coverage-settings tests/coverage.config
          --results-directory artifacts/TestResults
      - name: Coverage gate
        run: dotnet run eng/coverage-gate.cs -- artifacts/TestResults
      # Package validation runs in the pack: it compares the package with 1.2.5 on nuget.org, and passes only the
      # dropped netstandard2.0, which src/Tableau.Api/CompatibilitySuppressions.xml suppresses.
      - name: Pack
        run: dotnet pack src/Tableau.Api/Tableau.Api.csproj --no-build -c Release -o artifacts/packages
      - name: Check the package
        run: dotnet run eng/package-check.cs -- artifacts/packages
      # 1.2.5's DLL against this build, each with the assemblies it compiles against, by the ApiCompat tool pinned in
      # dotnet-tools.json. It fails on a break the ledger doesn't list, on an entry that is no longer a break, and on a
      # ledger that differs from what the tool writes for this build.
      - name: Compare the API with 1.2.5's
        run: dotnet run eng/apicompat.cs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 14

  # The culture and the time zone come from the environment, read by .NET through ICU, which needs no OS locale
  # installed. They are set for the test step alone, so the build and the coverage gate run as everywhere else, and
  # TABLEAU_TEST_CULTURE and TABLEAU_TEST_TIME_ZONE tell the canary in tests/Tableau.Api.Tests/CultureTests.cs what to
  # find.
  cultures:
    name: Tests (Linux, ${{ matrix.culture }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - culture: sv-SE
            locale: sv_SE.UTF-8
            time-zone: Asia/Kathmandu
          - culture: tr-TR
            locale: tr_TR.UTF-8
            time-zone: America/St_Johns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore Tableau.Api.slnx --locked-mode
      - name: Build
        run: dotnet build Tableau.Api.slnx --no-restore -c Release
      - name: Test with coverage, in ${{ matrix.culture }} and ${{ matrix.time-zone }}
        env:
          LANG: ${{ matrix.locale }}
          LC_ALL: ${{ matrix.locale }}
          TZ: ${{ matrix.time-zone }}
          TABLEAU_TEST_CULTURE: ${{ matrix.culture }}
          TABLEAU_TEST_TIME_ZONE: ${{ matrix.time-zone }}
        run: >-
          dotnet test --solution Tableau.Api.slnx --no-build -c Release
          --coverage --coverage-output-format cobertura --coverage-settings tests/coverage.config
          --results-directory artifacts/TestResults
      - name: Coverage gate
        run: dotnet run eng/coverage-gate.cs -- artifacts/TestResults

  windows:
    name: Selftest and tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The version .gitleaks.toml names, checked against the SHA-256 its release publishes, so the selftest's gitleaks
      # cases run here too.
      - name: Install gitleaks
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e") { throw "gitleaks checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "gitleaks"
          Expand-Archive -Path $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: The gate's selftest
        run: dotnet run eng/gate.cs -- selftest
      - name: Test with coverage
        run: >-
          dotnet test --solution Tableau.Api.slnx -c Release
          --coverage --coverage-output-format cobertura --coverage-settings tests/coverage.config
          --results-directory artifacts/TestResults
      - name: Coverage gate
        run: dotnet run eng/coverage-gate.cs -- artifacts/TestResults

  # The library in a native AOT app (tests/Tableau.Api.Aot/README.md says what it checks). Its warnings are errors, and
  # one per problem, so the log names each.
  aot:
    name: Native AOT (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The native AOT compiler links with clang and zlib. The runner image has them; this covers an image that does
      # not.
      - name: Native AOT prerequisites
        run: |
          if ! command -v clang >/dev/null || ! dpkg -s zlib1g-dev >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
          fi
      # Restored on its own: publish -r would restore every project for that runtime, which their lock files don't
      # hold.
      - name: Restore (locked)
        run: dotnet restore tests/Tableau.Api.Aot --locked-mode
      - name: Publish with native AOT
        run: dotnet publish tests/Tableau.Api.Aot --no-restore -c Release -r linux-x64 -o artifacts/aot
      - name: Run the native app
        run: artifacts/aot/Tableau.Api.Aot

  # The check the main ruleset requires: every job above passed. It runs whatever happened to them,
  # since a required check that is skipped counts as passed, and it fails when one of them failed, was cancelled or was
  # skipped. A matrix's result is failure when any of its legs failed.
  ci:
    name: CI
    needs: [checks, package, cultures, windows, aot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          CHECKS: ${{ needs.checks.result }}
          PACKAGE: ${{ needs.package.result }}
          CULTURES: ${{ needs.cultures.result }}
          WINDOWS: ${{ needs.windows.result }}
          AOT: ${{ needs.aot.result }}
        run: |
          echo "Checks (Linux): $CHECKS. Build, test and pack (Linux): $PACKAGE."
          echo "Tests (Linux, sv-SE and tr-TR): $CULTURES. Selftest and tests (Windows): $WINDOWS. Native AOT (Linux): $AOT."
          test "$CHECKS" = success && test "$PACKAGE" = success && test "$CULTURES" = success && test "$WINDOWS" = success \
            && test "$AOT" = success
