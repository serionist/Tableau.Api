# CI on every pull request, every push to main, once a day on main, and by hand. Checks (Linux) runs the gate's quick
# lane: its selftest, the library's build, AGENTS.md, the skills and their links, the hooks, no tool attribution in the
# commits, and gitleaks over them. Build and pack (Linux) builds the library in Release, packs it, and checks the
# package with eng/package-check.cs. No tests run here: the solution's old test project doesn't build and needs a
# Tableau site, so a PR says what ran against one (AGENTS.md, Build and test). CI sums the run up; it and
# pr-text.yml's PR text are the checks the main ruleset requires.
#
# The daily run is for Dependabot's merges: dependabot-auto-merge.yml turns on auto-merge with the workflow's token,
# and a push made with that token starts no run, so main is checked within a day of one instead.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per ref. A newer push to a PR cancels its older run. Each run on main, a push, the daily one or one by
  # hand, keeps its own result: its group also names the commit, so the next push never cancels a waiting run.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The attribution and secret checks read the commits since the base, which a shallow clone doesn't have.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The version .gitleaks.toml names, checked against the SHA-256 its release publishes.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C /usr/local/bin gitleaks
      # The commits checked start after the PR's base, or after the commit main was on before the push. A PR's checkout
      # is the merge of its branch into the base, so that merge is checked too. A push's before is all zeros for a new
      # branch, and a commit no longer in the history after a force push; the daily run and a run by hand have none.
      # Then the head commit alone is checked, since a squash merge is one commit. GATE_REQUIRE_GITLEAKS makes a
      # missing gitleaks a failure, not a warning.
      - name: The gate's quick lane
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_REQUIRE_GITLEAKS: "1"
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::${BASE:-no base} is not in the history; checking HEAD~1..HEAD"
            BASE=HEAD~1
          fi
          dotnet run eng/gate.cs -- quick --base "$BASE"

  # What a release would publish, packed and checked on every run. The project turns ContinuousIntegrationBuild on
  # where GITHUB_ACTIONS is set, so the build and the package hold no path of the runner.
  package:
    name: Build and pack (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The library alone: the solution's old test project doesn't build (AGENTS.md, Build and test).
      - name: Build
        run: dotnet build Tableau.Api/Tableau.Api.csproj -c Release
      - name: Pack
        run: dotnet pack Tableau.Api/Tableau.Api.csproj --no-build -c Release -o artifacts/packages
      - name: Check the package
        run: dotnet run eng/package-check.cs -- artifacts/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 14

  # The check the main ruleset requires: every job above passed. It runs whatever happened to them, since a required
  # check that is skipped counts as passed, and it fails when one of them failed, was cancelled or was skipped.
  ci:
    name: CI
    needs: [checks, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          CHECKS: ${{ needs.checks.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          echo "Checks (Linux): $CHECKS. Build and pack (Linux): $PACKAGE."
          test "$CHECKS" = success && test "$PACKAGE" = success
