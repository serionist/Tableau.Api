# CI on every pull request, every push to main, once a day on main, and by hand.
#
# - Checks (Linux): the gate's quick lane: its selftest, the library's build, AGENTS.md, the skills and their links, the
#   hooks, no tool attribution in the commits, and gitleaks over them.
# - Build, test and pack (Linux): the solution, Tableau.Api.slnx, restored in locked mode and built in Release; the
#   offline tests; the package, packed with package validation against 1.2.5 and checked with eng/package-check.cs; and
#   the API compared with 1.2.5's by eng/apicompat.cs, against the ledger of breaks in eng/apicompat/1.2.5.xml.
# - Selftest and tests (Windows): the gate's selftest and the offline tests, where paths, line endings and the TLS stack
#   differ from Linux.
# - CI sums those up; it and pr-text.yml's PR text are the checks the main ruleset requires.
#
# Every job that builds the library checks out the whole history: MinVer versions it from git's tags and history, and
# a shallow clone would give it neither.
#
# Nothing here runs on a Tableau site: the old live suite is in no solution and needs one, so a PR says what ran
# against one (AGENTS.md, Build and test).
#
# The daily run is for Dependabot's merges: dependabot-auto-merge.yml turns on auto-merge with the workflow's token,
# and a push made with that token starts no run, so main is checked within a day of one instead.
#
# release/1.x's weekly package audit is audit-1x.yml, a workflow of its own, so a failure there leaves main's CI and
# its badge alone.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per ref. A newer push to a PR cancels its older run. Each run on main, a push, a scheduled one or one by
  # hand, keeps its own result: its group also names the commit, so the next push never cancels a waiting run.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The attribution and secret checks read the commits since the base, which a shallow clone doesn't have, and
          # MinVer reads the history when the gate builds the library.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The version .gitleaks.toml names, checked against the SHA-256 its release publishes.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C /usr/local/bin gitleaks
      # The commits checked start after the PR's base, or after the commit main was on before the push. A PR's checkout
      # is the merge of its branch into the base, so that merge is checked too. A push's before is all zeros for a new
      # branch, and a commit no longer in the history after a force push; a scheduled run and a run by hand have none.
      # Then the head commit alone is checked, since a squash merge is one commit. GATE_REQUIRE_GITLEAKS makes a
      # missing gitleaks a failure, not a warning.
      - name: The gate's quick lane
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_REQUIRE_GITLEAKS: "1"
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::${BASE:-no base} is not in the history; checking HEAD~1..HEAD"
            BASE=HEAD~1
          fi
          dotnet run eng/gate.cs -- quick --base "$BASE"

  # What a release would publish, tested, packed and checked on every run. ContinuousIntegrationBuild is on where
  # GITHUB_ACTIONS is set, so the build and the package hold no path of the runner, and every restore is locked where CI
  # is set (Directory.Build.props).
  package:
    name: Build, test and pack (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # In a shallow clone MinVer finds no history and versions every build 2.0.0-alpha.0, without a warning.
      - name: The whole history, for MinVer
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - name: Restore (locked)
        run: dotnet restore Tableau.Api.slnx --locked-mode
      - name: Build
        run: dotnet build Tableau.Api.slnx --no-restore -c Release
      # global.json runs the tests on Microsoft.Testing.Platform.
      - name: Test
        run: dotnet test --solution Tableau.Api.slnx --no-build -c Release
      # Package validation runs in the pack: it compares the package with 1.2.5 on nuget.org, and passes only the
      # dropped netstandard2.0, which src/Tableau.Api/CompatibilitySuppressions.xml suppresses.
      - name: Pack
        run: dotnet pack src/Tableau.Api/Tableau.Api.csproj --no-build -c Release -o artifacts/packages
      - name: Check the package
        run: dotnet run eng/package-check.cs -- artifacts/packages
      # 1.2.5's DLL against this build, each with the assemblies it compiles against, by the ApiCompat tool pinned in
      # dotnet-tools.json. It fails on a break the ledger doesn't list, on an entry that is no longer a break, and on a
      # ledger that differs from what the tool writes for this build.
      - name: Compare the API with 1.2.5's
        run: dotnet run eng/apicompat.cs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Selftest and tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The version .gitleaks.toml names, checked against the SHA-256 its release publishes, so the selftest's gitleaks
      # cases run here too.
      - name: Install gitleaks
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e") { throw "gitleaks checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "gitleaks"
          Expand-Archive -Path $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: The gate's selftest
        run: dotnet run eng/gate.cs -- selftest
      - name: Test
        run: dotnet test --solution Tableau.Api.slnx -c Release

  # The check the main ruleset requires: every job above passed. It runs whatever happened to them,
  # since a required check that is skipped counts as passed, and it fails when one of them failed, was cancelled or was
  # skipped.
  ci:
    name: CI
    needs: [checks, package, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          CHECKS: ${{ needs.checks.result }}
          PACKAGE: ${{ needs.package.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "Checks (Linux): $CHECKS. Build, test and pack (Linux): $PACKAGE."
          echo "Selftest and tests (Windows): $WINDOWS."
          test "$CHECKS" = success && test "$PACKAGE" = success && test "$WINDOWS" = success
