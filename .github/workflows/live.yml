# The live suite: the tests in the Live category (tests/Tableau.Api.Tests/TableauSite.cs and LiveSite.cs), run against
# the maintainers' Tableau Server every night and by hand, from main alone.
#
# - Two sign-ins, each with its own job. Every content test signs in with a personal access token made for CI alone, a
#   server administrator's on the default site (TABLEAU_LIVE_PAT_NAME, TABLEAU_LIVE_PAT_SECRET). The direct-trust
#   connected app (TABLEAU_LIVE_CLIENT_ID, TABLEAU_LIVE_SECRET_ID, TABLEAU_LIVE_SECRET_VALUE, TABLEAU_LIVE_USER) signs
#   in for its own tests alone (LiveConnectedAppTests), since on Tableau Server 2025.1 a connected app's session can't
#   call a method whose scope came in REST API 3.27. A token allows one session at a time: a maintainer's local run
#   signs in with another token, so it and this run never sign each other out.
# - Its job runs in the tableau-live environment, which holds the site's settings as secrets and deploys from main
#   alone, and the workflow has no pull_request trigger: no pull request, and no fork, reaches them.
# - The nightly run waits for the repository variable TABLEAU_LIVE_NIGHTLY to be true, so it stays off until the
#   environment is set up; a run by hand needs no variable. Once it runs, each setting a test's sign-in needs fails
#   the test, named, when it is missing: the suite never passes as skipped. A night with the variable unset shows its
#   job as skipped.
# - TABLEAU_LIVE_SITE is optional: GitHub keeps no empty secret, and an unset one reaches the tests as the empty string,
#   which is the default site.
# - One run at a time: the suite makes a site named after the run, works in it, with Tableau's samples published into
#   a project there, and deletes it at the end, everything in it with it; before it makes one, it deletes the run sites
#   an earlier run left behind more than a day ago, and names any it can't. So it needs a Tableau Server, and a server
#   administrator's token. The connected app's JWT asks for the scope tableau:content:read alone, for the page of
#   projects its tests read on TABLEAU_LIVE_SITE (LiveSite.cs).
# - The suite's log check fails on any log line holding a setting's secret or a token any of its clients carried, and
#   on one holding an invented secret or a query value; in a run that reached a site it counts such lines and shows
#   none, since a line may hold a live value no list names, such as a JWT the client minted, and this log is public.
# - TABLEAU_LIVE_MATRIX=1 holds docs/live-coverage.md to the run: the suite's cleanup fails the run, naming the row, when
#   a call a row says is live wasn't answered so by its tests, or one it says isn't was answered. A local run of one
#   class leaves it unset.
name: Live

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tableau-live
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  live:
    name: Live suite
    # main alone; the nightly run once the maintainers have turned it on.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.TABLEAU_LIVE_NIGHTLY == 'true')
    runs-on: ubuntu-latest
    environment: tableau-live
    # A site made and deleted, and the waits for a new site's index.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer reads the history when the library builds.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore tests/Tableau.Api.Tests/Tableau.Api.Tests.csproj --locked-mode
      - name: Build
        run: dotnet build tests/Tableau.Api.Tests/Tableau.Api.Tests.csproj --no-restore -c Release
      - name: The Live tests
        env:
          TABLEAU_LIVE: "1"
          TABLEAU_LIVE_MATRIX: "1"
          TABLEAU_LIVE_SERVER_URL: ${{ secrets.TABLEAU_LIVE_SERVER_URL }}
          TABLEAU_LIVE_SITE: ${{ secrets.TABLEAU_LIVE_SITE }}
          TABLEAU_LIVE_PAT_NAME: ${{ secrets.TABLEAU_LIVE_PAT_NAME }}
          TABLEAU_LIVE_PAT_SECRET: ${{ secrets.TABLEAU_LIVE_PAT_SECRET }}
          TABLEAU_LIVE_CLIENT_ID: ${{ secrets.TABLEAU_LIVE_CLIENT_ID }}
          TABLEAU_LIVE_SECRET_ID: ${{ secrets.TABLEAU_LIVE_SECRET_ID }}
          TABLEAU_LIVE_SECRET_VALUE: ${{ secrets.TABLEAU_LIVE_SECRET_VALUE }}
          TABLEAU_LIVE_USER: ${{ secrets.TABLEAU_LIVE_USER }}
        run: >-
          dotnet test --project tests/Tableau.Api.Tests/Tableau.Api.Tests.csproj --no-build -c Release
          --filter "TestCategory=Live"
