# CodeQL code scanning, with the security-extended queries, on every pull request to main, every push to main and once
# a week, so new queries also reach code that has not changed. Results go to the repository's Security tab and annotate
# the PR. A Dependabot merge starts no push run (dependabot-auto-merge.yml): the weekly run covers main after one.
#
# C# is built by hand, the library alone as CI builds it, since the solution's old test project doesn't build
# (AGENTS.md, Build and test); CodeQL reads what the compiler saw. The workflows themselves (language "actions") are
# scanned too, for script injection and over-broad permissions, with nothing to build.
#
# This is CodeQL's advanced setup: the repository's default setup must stay off, or the two uploads conflict.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  # As in ci.yml: a newer push to a PR cancels its older run, and each push to main or weekly run keeps its own result.
  group: codeql-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Uploads the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build the library
        if: matrix.language == 'csharp'
        run: dotnet build Tableau.Api/Tableau.Api.csproj -c Release
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
