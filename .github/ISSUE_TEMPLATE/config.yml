# Issues open from the forms only. A security vulnerability never goes into an issue, which anyone can read.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/serionist/Tableau.Api/security/advisories/new
    about: Privately, through GitHub's private vulnerability reporting. SECURITY.md says what to include.
  - name: Security policy
    url: https://github.com/serionist/Tableau.Api/blob/main/SECURITY.md
    about: Which versions get security fixes, and how a report is handled.
